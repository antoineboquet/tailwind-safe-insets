name: Publish to npm

# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret, and provenance is
# attached automatically. npm cannot publish a brand-new package through OIDC,
# so publish 0.1.0 by hand first, then configure the trusted publisher on
# npmjs.com (package settings → Trusted publishing → GitHub Actions,
# workflow "publish.yml").

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Publish package
        run: npm publish