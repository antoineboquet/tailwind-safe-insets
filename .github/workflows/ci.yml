name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tailwind CSS ${{ matrix.tailwind }}${{ matrix.merge != 'locked' && format(', tailwind-merge {0}', matrix.merge) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version allowed by peerDependencies, and the current release.
        tailwind: ["4.0.0", "latest"]
        # tailwind-merge from package-lock.json, plus the lowest version the helper supports.
        merge: ["locked"]
        include:
          - tailwind: "latest"
            merge: "3.0.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Tailwind CSS ${{ matrix.tailwind }}
        run: |
          # One install, so that a second one does not reset the first to the lockfile.
          packages="tailwindcss@${{ matrix.tailwind }} @tailwindcss/node@${{ matrix.tailwind }}"
          if [ "${{ matrix.merge }}" != "locked" ]; then packages="$packages tailwind-merge@${{ matrix.merge }}"; fi
          npm install --no-save $packages
          for p in tailwindcss tailwind-merge; do echo "$p $(node -p "require('./node_modules/$p/package.json').version")"; done

      - name: Run tests
        run: npm test

      - name: Smoke-test the packed tarball as a consumer would install it
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/tailwind-safe-insets-*.tgz \
            tailwindcss@${{ matrix.tailwind }} @tailwindcss/node@${{ matrix.tailwind }}
          node --input-type=module -e '
            import { compile } from "@tailwindcss/node";
            const c = await compile(
              `@import "tailwindcss/theme" theme(reference);\n@import "tailwindcss/utilities";\n@import "tailwind-safe-insets";`,
              { base: process.cwd(), onDependency() {} },
            );
            const css = c.build(["pb-safe-4"]);
            if (!css.includes("env(safe-area-inset-bottom, 0px)")) {
              console.error(css);
              process.exit(1);
            }
            console.log("tailwind-safe-insets resolved and compiled from the tarball");
          '